name: Test and Build

on:
  push:
    branches: [master]
  pull_request:
    paths-ignore: [README.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  test-go:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: windows
            runner: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Go cache
        id: go-cache
        shell: bash
        env:
          GO_DEPS_HASH: ${{ hashFiles('go.mod', 'go.sum', 'molo/go.mod', 'molo/go.sum') }}
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          PREFIX="${{ runner.os }}-${{ runner.arch }}-go-${GO_DEPS_HASH}-"
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
          echo "key=${PREFIX}$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        id: restore-go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.gomodcache }}
            ${{ steps.go-cache.outputs.gocache }}
          # Always fall back to restore-keys so any branch picks up the newest
          # daily cache entry saved on master.
          key: nonexistent
          restore-keys: |
            ${{ steps.go-cache.outputs.prefix }}
            ${{ runner.os }}-${{ runner.arch }}-go-

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Download Go modules
        run: |
          go mod download
          go -C molo mod download

      - name: Vet Go packages
        run: go vet ./backend/... ./internal/...

      - name: Run Go tests
        run: go test ./backend/... ./internal/...

      - name: Trim Go cache
        if: github.ref == 'refs/heads/master' && steps.restore-go-cache.outputs.cache-matched-key != steps.go-cache.outputs.key
        shell: bash
        run: |
          GOCACHE_DIR="${{ steps.go-cache.outputs.gocache }}"
          if [ -d "$GOCACHE_DIR" ]; then
            find "$GOCACHE_DIR" -type f -mmin +90 -delete
          fi

      - name: Save Go cache
        if: github.ref == 'refs/heads/master' && steps.restore-go-cache.outputs.cache-matched-key != steps.go-cache.outputs.key
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.gomodcache }}
            ${{ steps.go-cache.outputs.gocache }}
          key: ${{ steps.go-cache.outputs.key }}

  build:
    name: Build (${{ matrix.os }})
    needs: [test-frontend, test-go]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            artifact: molow-linux-amd64
            binary: bin/molow
          - os: windows
            runner: windows-latest
            artifact: molow-windows-amd64
            binary: bin/molow.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Go cache
        id: go-cache
        shell: bash
        env:
          GO_DEPS_HASH: ${{ hashFiles('go.mod', 'go.sum', 'molo/go.mod', 'molo/go.sum') }}
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "prefix=${{ runner.os }}-${{ runner.arch }}-go-${GO_DEPS_HASH}-" >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.gomodcache }}
            ${{ steps.go-cache.outputs.gocache }}
          key: nonexistent
          restore-keys: |
            ${{ steps.go-cache.outputs.prefix }}
            ${{ runner.os }}-${{ runner.arch }}-go-

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Install Wails v3 CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          GOPATH_DIR="$(go env GOPATH)"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "${GOPATH_DIR}\\bin" >> "$GITHUB_PATH"
          else
            echo "${GOPATH_DIR}/bin" >> "$GITHUB_PATH"
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build application
        run: wails3 build GOOS=${{ matrix.os }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14
